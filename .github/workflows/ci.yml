name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, so a new advisory against a dependency shows up without a push.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - name: Build the PAM module
        if: runner.os == 'macOS'
        run: cc -bundle -Wall -Wextra -Werror -o pam_aye.so pam/pam_aye.c -lpam

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
