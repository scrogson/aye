[package]
name = "approver"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
webauthn-rs = "0.5"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
web-push = { version = "0.11", default-features = false }
ct-codecs = "1"
jwt-simple = { version = "0.12.17", default-features = false, features = ["pure-rust"] }

[dev-dependencies]
ece = "2"
