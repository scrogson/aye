[package]
name = "aye"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
webauthn-rs = "0.5"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
web-push = { version = "0.11", default-features = false }
ct-codecs = "1"
jwt-simple = { version = "0.12.17", default-features = false, features = ["pure-rust"] }

[dev-dependencies]
ece = "2"

# On macOS, build OpenSSL into the binaries (webauthn-rs and web-push need it)
# so they don't depend on Homebrew's copy.
[target.'cfg(target_os = "macos")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
